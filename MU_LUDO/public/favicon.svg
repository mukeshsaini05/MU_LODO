<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gold Border Gradient -->
    <linearGradient id="goldBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#fef08a" />
      <stop offset="30%" stopColor="#f59e0b" />
      <stop offset="70%" stopColor="#d97706" />
      <stop offset="100%" stopColor="#fef08a" />
    </linearGradient>

    <!-- Dark Background Radial Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#1e293b" />
      <stop offset="100%" stopColor="#040813" />
    </radialGradient>

    <!-- Pawn Radial Colors -->
    <radialGradient id="pawnRed" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stopColor="#fca5a5" />
      <stop offset="40%" stopColor="#ef4444" />
      <stop offset="100%" stopColor="#7f1d1d" />
    </radialGradient>

    <radialGradient id="pawnGreen" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stopColor="#86efac" />
      <stop offset="40%" stopColor="#22c55e" />
      <stop offset="100%" stopColor="#14532d" />
    </radialGradient>

    <radialGradient id="pawnYellow" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stopColor="#fef08a" />
      <stop offset="40%" stopColor="#f59e0b" />
      <stop offset="100%" stopColor="#78350f" />
    </radialGradient>

    <radialGradient id="pawnBlue" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stopColor="#93c5fd" />
      <stop offset="40%" stopColor="#3b82f6" />
      <stop offset="100%" stopColor="#1e3a8a" />
    </radialGradient>

    <!-- 3D Text Extrusions & Glows -->
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Rounded Squircle Badge -->
  <rect x="12" y="12" width="488" height="488" rx="96" fill="url(#bgGlow)" stroke="url(#goldBorderGrad)" strokeWidth="16" />
  <rect x="24" y="24" width="464" height="464" rx="84" fill="none" stroke="#fef08a" strokeWidth="2" opacity="0.4" />

  <!-- Center Diamond Ludo Board -->
  <g transform="translate(256 220) rotate(45) translate(-130 -130)">
    <!-- Main Board Frame -->
    <rect x="0" y="0" width="260" height="260" rx="16" fill="#ffffff" stroke="url(#goldBorderGrad)" strokeWidth="8" />
    
    <!-- Quadrants -->
    <rect x="10" y="10" width="105" height="105" fill="#ef4444" rx="8" />
    <rect x="145" y="10" width="105" height="105" fill="#22c55e" rx="8" />
    <rect x="145" y="145" width="105" height="105" fill="#f59e0b" rx="8" />
    <rect x="10" y="145" width="105" height="105" fill="#3b82f6" rx="8" />

    <!-- Center Home Cross Lines -->
    <path d="M115 115 L145 115 L130 130 Z" fill="#ef4444" />
    <path d="M145 115 L145 145 L130 130 Z" fill="#22c55e" />
    <path d="M145 145 L115 145 L130 130 Z" fill="#f59e0b" />
    <path d="M115 145 L115 115 L130 130 Z" fill="#3b82f6" />
    
    <!-- Paths Grid Overlay -->
    <rect x="115" y="10" width="30" height="105" fill="#ffffff" stroke="#cbd5e1" strokeWidth="2" />
    <rect x="10" y="115" width="105" height="30" fill="#ffffff" stroke="#cbd5e1" strokeWidth="2" />
    <rect x="145" y="115" width="105" height="30" fill="#ffffff" stroke="#cbd5e1" strokeWidth="2" />
    <rect x="115" y="145" width="30" height="105" fill="#ffffff" stroke="#cbd5e1" strokeWidth="2" />
  </g>

  <!-- 3D White Dice (Top Center) -->
  <g transform="translate(256 140)">
    <!-- Dice Cube -->
    <path d="M0 -30 L32 -14 L0 2 L-32 -14 Z" fill="#ffffff" stroke="#e2e8f0" strokeWidth="2" />
    <path d="M-32 -14 L0 2 L0 34 L-32 18 Z" fill="#cbd5e1" stroke="#94a3b8" strokeWidth="2" />
    <path d="M0 2 L32 -14 L32 18 L0 34 Z" fill="#94a3b8" stroke="#64748b" strokeWidth="2" />
    <!-- Dots -->
    <circle cx="0" cy="-14" r="3.5" fill="#0f172a" />
    <circle cx="-16" cy="-22" r="3" fill="#0f172a" />
    <circle cx="16" cy="-6" r="3" fill="#0f172a" />
    <circle cx="-16" cy="2" r="3" fill="#0f172a" />
    <circle cx="-16" cy="16" r="3" fill="#0f172a" />
    <circle cx="16" cy="2" r="3" fill="#0f172a" />
    <circle cx="16" cy="16" r="3" fill="#0f172a" />
  </g>

  <!-- 4 Standalone 3D Glossy Pawns -->
  <!-- Red Pawn Top-Left -->
  <g transform="translate(110 120)">
    <ellipse cx="0" cy="38" rx="20" ry="6" fill="#000000" opacity="0.3" />
    <circle cx="0" cy="0" r="15" fill="url(#pawnRed)" />
    <path d="M-10 10 L10 10 L14 36 C14 38, -14 38, -14 36 Z" fill="url(#pawnRed)" />
    <ellipse cx="0" cy="36" rx="16" ry="5" fill="url(#pawnRed)" />
  </g>

  <!-- Green Pawn Top-Right -->
  <g transform="translate(402 120)">
    <ellipse cx="0" cy="38" rx="20" ry="6" fill="#000000" opacity="0.3" />
    <circle cx="0" cy="0" r="15" fill="url(#pawnGreen)" />
    <path d="M-10 10 L10 10 L14 36 C14 38, -14 38, -14 36 Z" fill="url(#pawnGreen)" />
    <ellipse cx="0" cy="36" rx="16" ry="5" fill="url(#pawnGreen)" />
  </g>

  <!-- Blue Pawn Bottom-Left -->
  <g transform="translate(85 320)">
    <ellipse cx="0" cy="38" rx="20" ry="6" fill="#000000" opacity="0.3" />
    <circle cx="0" cy="0" r="15" fill="url(#pawnBlue)" />
    <path d="M-10 10 L10 10 L14 36 C14 38, -14 38, -14 36 Z" fill="url(#pawnBlue)" />
    <ellipse cx="0" cy="36" rx="16" ry="5" fill="url(#pawnBlue)" />
  </g>

  <!-- Yellow Pawn Bottom-Right -->
  <g transform="translate(425 320)">
    <ellipse cx="0" cy="38" rx="20" ry="6" fill="#000000" opacity="0.3" />
    <circle cx="0" cy="0" r="15" fill="url(#pawnYellow)" />
    <path d="M-10 10 L10 10 L14 36 C14 38, -14 38, -14 36 Z" fill="url(#pawnYellow)" />
    <ellipse cx="0" cy="36" rx="16" ry="5" fill="url(#pawnYellow)" />
  </g>

  <!-- 3D Extruded Title Text: MU -->
  <g transform="translate(256 250)" filter="url(#glowBlue)">
    <!-- Shadow extrusion -->
    <text x="0" y="6" textAnchor="middle" font-family="'Outfit', sans-serif" font-weight="900" font-size="95" fill="#1e3a8a">MU</text>
    <text x="0" y="3" textAnchor="middle" font-family="'Outfit', sans-serif" font-weight="900" font-size="95" fill="#1d4ed8">MU</text>
    <!-- Front Text -->
    <text x="0" y="0" textAnchor="middle" font-family="'Outfit', sans-serif" font-weight="900" font-size="95" fill="url(#blueTextGrad)">MU</text>
  </g>

  <!-- 3D Extruded Title Text: LUDO -->
  <g transform="translate(256 345)" filter="url(#glowGold)">
    <!-- Shadow extrusion -->
    <text x="0" y="8" textAnchor="middle" font-family="'Outfit', sans-serif" font-weight="900" font-size="105" fill="#78350f">LUDO</text>
    <text x="0" y="4" textAnchor="middle" font-family="'Outfit', sans-serif" font-weight="900" font-size="105" fill="#b45309">LUDO</text>
    <!-- Front Text -->
    <text x="0" y="0" textAnchor="middle" font-family="'Outfit', sans-serif" font-weight="900" font-size="105" fill="url(#goldTextGrad)">LUDO</text>
  </g>

  <defs>
    <linearGradient id="blueTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#60a5fa" />
      <stop offset="50%" stopColor="#3b82f6" />
      <stop offset="100%" stopColor="#2563eb" />
    </linearGradient>

    <linearGradient id="goldTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#fef08a" />
      <stop offset="40%" stopColor="#fbbf24" />
      <stop offset="80%" stopColor="#f59e0b" />
      <stop offset="100%" stopColor="#d97706" />
    </linearGradient>
  </defs>
</svg>